name: Verify frontend and Python syntax
on:
  push:
    branches: [feature/camsec-capabilities]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile Python source (syntax only)
        run: python -m compileall -q main.py operations_api.py server_engine.py face_pipeline.py auth.py db.py
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"
      - name: Verify operations API behavior (mock database)
        run: python -m unittest discover -s tests -p "test_operations_api.py" -v
      - name: Install React dependencies
        run: npm ci
        working-directory: frontend
      - name: Build React
        run: npm run build
        working-directory: frontend
