server {
    listen 80;
    server_name attendance.yourcompany.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name attendance.yourcompany.com;
    ssl_certificate     /etc/ssl/attendance/fullchain.pem;
    ssl_certificate_key /etc/ssl/attendance/privkey.pem;

    client_max_body_size 25m;                 # 4+ enrolment photos per request

    root /srv/attendance/app/frontend/dist;   # React build
    index index.html;

    location / { try_files $uri /index.html; }

    location ~ ^/(api|snapshots|photos)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # enrolment runs the face model
    }
}
